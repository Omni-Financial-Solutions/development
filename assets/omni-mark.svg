<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="OMNI mark">
  <title>OMNI mark</title>
  <defs>
    <linearGradient id="omni-grad-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/><stop offset=".52" stop-color="#9333EA"/><stop offset="1" stop-color="#D946EF"/>

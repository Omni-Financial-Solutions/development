<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="OMNI mark">
  <title>OMNI mark</title>
  <!-- Simplified joined mark for small sizes / app icon / favicon:
       the O joined into the M as one continuous rounded stroke,
       white on ink, mint dot as the single accent. -->

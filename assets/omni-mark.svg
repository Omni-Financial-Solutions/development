  <path d="M39 36 A13 13 0 0 1 13 36 A13 13 0 0 1 39 36 L46 49 V23 L54 36 L62 23 V49"
        fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4 0) scale(0.92)"/>
  <circle cx="60" cy="12" r="3.4" fill="#00D084"/>
</svg>
